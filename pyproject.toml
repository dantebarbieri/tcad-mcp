[project]
name = "tcad-mcp"
version = "0.3.6"
description = "MCP server wrapping the Travis Central Appraisal District public portal (TrueProdigy backend)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Dante Barbieri" }]
requires-python = ">=3.11"
keywords = ["mcp", "tcad", "trueprodigy", "appraisal", "real-estate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp>=3.2,<4",
    "httpx>=0.28,<1",
    "starlette>=0.40,<1",
    "uvicorn>=0.30,<1",
    "joserfc>=1.6.7,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.34",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/dantebarbieri/tcad-mcp"
Issues = "https://github.com/dantebarbieri/tcad-mcp/issues"

[project.scripts]
tcad-mcp = "tcad_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tcad_mcp*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
