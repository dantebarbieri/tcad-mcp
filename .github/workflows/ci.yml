name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: tcad-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Stable aggregate check used by branch protection. Status check names
  # for matrix jobs (`lint-and-test (3.11)`, etc.) can shift when GitHub
  # tweaks how matrix legs are rendered; requiring this single job
  # insulates branch protection from that fragility.
  ci-required:
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker-build]
    if: always()
    steps:
      - name: Verify all required jobs passed
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if echo "$RESULTS" | grep -E '"result": *"(failure|cancelled|skipped)"'; then
            echo "One or more required upstream jobs did not succeed."
            exit 1
          fi
