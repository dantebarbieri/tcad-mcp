# Example single-service compose file for running tcad-mcp standalone.
#
# For the full multi-server MCP stack on the homeserver, see
# https://github.com/dantebarbieri/homeserver/blob/main/docker/compose.mcp.yml

services:
  tcad-mcp:
    image: ghcr.io/dantebarbieri/tcad-mcp:latest
    # Or build locally during development:
    # build: .
    container_name: tcad-mcp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Static bearer auth — provide ONE of these.
      AUTH_TOKEN: ${MCP_TOKEN}
      # AUTH_TOKEN_FILE: /run/secrets/MCP_TOKEN

      # Optional — defaults shown.
      # TCAD_UPSTREAM_URL: https://prod-container.trueprodigyapi.com
      # TCAD_OFFICE: Travis
      # TCAD_HTTP_TIMEOUT: "20"

      # Optional OAuth 2.1 / OIDC — set OAUTH_ISSUER to enable. Works
      # against any OIDC-compliant IdP. Both static bearer (above) and
      # OAuth JWTs are accepted in parallel.
      # OAUTH_ISSUER: https://your-idp.example
      # OAUTH_AUDIENCE: https://mcp-tcad.example
      # RESOURCE_URL: https://mcp-tcad.example
      # OAUTH_REQUIRED_SCOPE: mcp:tcad
      # OAUTH_JWKS_URL: ""              # override; leave unset for OIDC discovery
      # OAUTH_DISCOVERY_TTL: "3600"
      # OAUTH_JWKS_TTL: "3600"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import socket; socket.create_connection(('localhost', 8080), timeout=3).close()"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
