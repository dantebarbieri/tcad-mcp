# Example single-service compose file for running tcad-mcp standalone.
#
# For the full multi-server MCP stack on the homeserver, see
# https://github.com/dantebarbieri/homeserver/blob/main/docker/compose.mcp.yml

services:
  tcad-mcp:
    image: ghcr.io/dantebarbieri/tcad-mcp:latest
    # Or build locally during development:
    # build: .
    container_name: tcad-mcp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # === Auth mode toggles (v0.3.0+) ==========================================
      # Each mode is independently enabled/disabled. Three states each:
      #   unset → auto-enable iff the mode's config (AUTH_TOKEN / OAUTH_ISSUER) is set
      #   "true"  → require it (boot fails if config is missing)
      #   "false" → force-disable even when config is present
      # If BOTH end up disabled, the server boots in OPEN mode (no auth) and
      # prints a warning to stderr.
      # BEARER_AUTH_ENABLED: "true"
      # OAUTH_AUTH_ENABLED: "true"

      # === Mode 1: static bearer ================================================
      # Provide ONE of these.
      AUTH_TOKEN: ${MCP_TOKEN}
      # AUTH_TOKEN_FILE: /run/secrets/MCP_TOKEN

      # === Mode 2/3: OAuth (manual client + Claude.ai discovery) ===============
      # Generic OIDC, only the *value* of OAUTH_ISSUER names the IdP.
      # OAUTH_ISSUER: https://your-idp.example
      # OAUTH_AUDIENCE: https://mcp-tcad.example
      # RESOURCE_URL: https://mcp-tcad.example
      # OAUTH_REQUIRED_SCOPE: mcp:tcad
      # OAUTH_JWKS_URL: ""              # override; leave unset for OIDC discovery
      # OAUTH_DISCOVERY_TTL: "3600"
      # OAUTH_JWKS_TTL: "3600"

      # === Upstream + transport ================================================
      # TCAD_UPSTREAM_URL: https://prod-container.trueprodigyapi.com
      # TCAD_OFFICE: Travis
      # TCAD_HTTP_TIMEOUT: "20"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import socket; socket.create_connection(('localhost', 8080), timeout=3).close()"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
